name: "dbt_artifacts"
version: "2.11.1"
config-version: 2
require-dbt-version: [">=1.10.0", "<3.0.0"]
profile: "dbt_artifacts"

clean-targets: # folders to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "logs"

models:
  dbt_artifacts:
    +materialized: view
    +file_format: '{{ "delta" if target.type == "databricks" else "" }}'
    sources:
      +materialized: incremental
      # Existing consumers' tables gain new columns when they re-run the package after upgrading;
      # full_refresh is off, so this is the only way new columns reach them.
      +on_schema_change: append_new_columns
      +full_refresh: false
      +persist_docs:
        # Databricks and SQL Server don't offer column-level support for persisting docs
        columns: '{{ target.type != "databricks" and target.type != "sqlserver" }}'
        relation: '{{ target.type != "sqlserver" }}'
      +as_columnstore: False

data_tests:
  dbt_artifacts:
    # The package's tests check its own SQL, not the consumer's data, and each one re-reads the views it
    # tests, so they are off by default. A project turns them on with `data_tests: dbt_artifacts: +enabled: true`
    # in its own dbt_project.yml, as the integration test project does. This must stay a literal: dbt doesn't
    # render Jinja in a package's `enabled` config for tests, and a templated value disables them.
    +enabled: false
