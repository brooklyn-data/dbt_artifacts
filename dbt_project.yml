name: "dbt_artifacts"
version: "2.11.1"
config-version: 2
require-dbt-version: [">=1.10.0", "<3.0.0"]
profile: "dbt_artifacts"

clean-targets: # folders to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "logs"

models:
  dbt_artifacts:
    +materialized: view
    +file_format: '{{ "delta" if target.type == "databricks" else "" }}'
    sources:
      +materialized: incremental
      # Existing consumers' tables gain new columns when they re-run the package after upgrading;
      # full_refresh is off, so this is the only way new columns reach them.
      +on_schema_change: append_new_columns
      +full_refresh: false
      +persist_docs:
        # These adapters don't offer column-level support for persisting docs.
        columns: '{{ target.type not in ["databricks", "sqlserver", "fabric"] }}'
        relation: '{{ target.type not in ["sqlserver", "fabric"] }}'
      +as_columnstore: False
