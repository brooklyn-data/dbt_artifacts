### DuckDB      #############################################################################################
# DuckDB runs in-process against a local file (integration_test_project/test.duckdb),
# so it needs no container and no credentials. Each env starts from a fresh file
# and builds twice: tests run before the on-run-end hook, so only the second
# build's tests see rows the upload wrote. The first build uploads in small
# chunks (dbt_artifacts_insert_batch_size) so the second build's tests catch
# rows lost or repeated at chunk boundaries. The last two commands run one model
# with dbt_artifacts_upload_manifest set to the string "false" (as an env_var()
# would set it) and check that the manifest datasets were skipped.
[testenv:integration_duckdb]
changedir = integration_test_project
deps =
    dbt-core<2.0.0
    dbt-duckdb<2.0.0
commands =
    python -c "import pathlib; pathlib.Path('test.duckdb').unlink(missing_ok=True)"
    dbt clean
    dbt deps
    dbt build --target duckdb --vars '{"dbt_artifacts_insert_batch_size": {"models": 7, "default": 2}}'
    dbt build --target duckdb
    dbt run --target duckdb --select stg_dbt__invocations --vars '{"dbt_artifacts_upload_manifest": "false"}'
    dbt test --target duckdb --select assert_manifest_upload_skipped --vars '{"dbt_artifacts_test_expect_manifest_skipped": true}'

[testenv:integration_duckdb_1_10_0]
changedir = integration_test_project
deps =
    dbt-core~=1.10.0
    dbt-duckdb~=1.10.0
commands =
    python -c "import pathlib; pathlib.Path('test.duckdb').unlink(missing_ok=True)"
    dbt clean
    dbt deps
    dbt build --target duckdb --vars '{"dbt_artifacts_insert_batch_size": {"models": 7, "default": 2}}'
    dbt build --target duckdb
    dbt run --target duckdb --select stg_dbt__invocations --vars '{"dbt_artifacts_upload_manifest": "false"}'
    dbt test --target duckdb --select assert_manifest_upload_skipped --vars '{"dbt_artifacts_test_expect_manifest_skipped": true}'

