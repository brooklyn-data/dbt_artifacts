### dbt Fusion  #############################################################################################
# dbt v2 (the Fusion engine) is the `dbt` package on PyPI. That package is a
# small installer: at install time it downloads the prebuilt Fusion wheel for
# the platform from dbt's CDN and checks it against a sha256 pinned inside the
# PyPI release. It needs Python 3.11+. Its `dbt` command clashes with
# dbt-core's, so Fusion only ever lives in these envs, never alongside Core.
#
# The version is pinned once, here. To bump it, change the pin and run
# `uv run tox -e fusion_parse,integration_duckdb_fusion` (plus
# integration_snowflake_fusion with Snowflake credentials).
#
# Ad-hoc commands: uv run tox -e fusion -- <dbt args>, e.g.
#   uv run tox -e fusion -- build --target duckdb
[testenv:fusion]
changedir = integration_test_project
deps = dbt==2.0.6
setenv =
    DBT_PROFILES_DIR = {env:DBT_PROFILES_DIR:{toxinidir}/integration_test_project}
    DBT_SEND_ANONYMOUS_USAGE_STATS = False
commands =
    dbt {posargs:--version}

# Parse with --warn-error so deprecations Fusion reports as "will error post
# preview" fail CI before they become hard errors. Parse never connects to the
# warehouse; scripts/ci/fusion-parse.sh supplies dummy Snowflake credentials.
[testenv:fusion_parse]
changedir = {[testenv:fusion]changedir}
deps = {[testenv:fusion]deps}
setenv = {[testenv:fusion]setenv}
commands =
    dbt deps --target snowflake
    dbt parse --target snowflake --warn-error --show-all-deprecations

# Same steps as integration_duckdb. Fusion's DuckDB file format differs from
# dbt-duckdb's, so the env deletes test.duckdb first. Every command names the
# target: Fusion resolves the profile's default target (snowflake) even for
# clean and deps, and exits 1 when its env vars are missing.
[testenv:integration_duckdb_fusion]
changedir = {[testenv:fusion]changedir}
deps = {[testenv:fusion]deps}
setenv = {[testenv:fusion]setenv}
commands =
    python -c "import pathlib; pathlib.Path('test.duckdb').unlink(missing_ok=True)"
    dbt clean --target duckdb
    dbt deps --target duckdb
    dbt build --target duckdb --vars '{"dbt_artifacts_insert_batch_size": {"models": 7, "default": 2}}'
    dbt build --target duckdb
    dbt run --target duckdb --select stg_dbt__invocations --vars '{"dbt_artifacts_upload_manifest": "false"}'
    dbt test --target duckdb --select assert_manifest_upload_skipped --vars '{"dbt_artifacts_test_expect_manifest_skipped": true}'

# Same steps as integration_snowflake.
[testenv:integration_snowflake_fusion]
changedir = {[testenv:fusion]changedir}
deps = {[testenv:fusion]deps}
setenv = {[testenv:fusion]setenv}
commands =
    dbt clean
    dbt deps
    dbt build --target snowflake --exclude-resource-type test
    dbt build --target snowflake --vars '{"artifacts_test_previous_build_excluded_tests": true}'
